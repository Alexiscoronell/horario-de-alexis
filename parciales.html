<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>parciales.log · Informática</title>
  <link rel="stylesheet" href="style.css">
  <script src="parciales.js" defer></script>
</head>
<body>

  <div class="wrap">
    <!-- Header -->
    <header class="term">
      <div class="term-bar">
        <a href="index.html" class="btn-back">← cd .. (volver)</a>
        <div class="toggle" id="themeToggle">
          <button id="btnDark" class="active" data-mode="dark">DARK</button>
          <button id="btnLight" data-mode="light">LIGHT</button>
        </div>
      </div>
      <div class="term-body">
        <div><span class="prompt">$</span> ./check_exams.sh --filter<span class="cursor"></span></div>
        <h1>CONTROL DE PARCIALES & NOTAS</h1>
        <div class="meta">Tocá una pestaña para filtrar entre pendientes y rendidos</div>
      </div>
    </header>

    <!-- Botones / Pestañas de Filtro Táctiles -->
    <section class="tabs-bar">
      <button class="tab-btn active" id="tabPendientes" onclick="switchTab('pendientes')">
        <span class="tab-num" id="countPendientes">0</span>
        <span class="tab-label">⏳ Pendientes</span>
      </button>

      <button class="tab-btn" id="tabAprobados" onclick="switchTab('aprobados')">
        <span class="tab-num" id="countAprobados" style="color:var(--green);">0</span>
        <span class="tab-label">🟢 Aprobados</span>
      </button>

      <button class="tab-btn" id="tabRecu" onclick="switchTab('recus')">
        <span class="tab-num" id="countRecus" style="color:var(--danger);">0</span>
        <span class="tab-label">🟡/🔴 Recu & Desapr</span>
      </button>
    </section>

    <!-- Caja de Contenido -->
    <section class="parciales-box">
      <div class="parciales-head">
        <span id="currentViewTitle">// PARCIALES PENDIENTES</span>
        <button class="btn-mini" id="btnToggleExamForm" type="button">+ Nuevo Parcial</button>
      </div>

      <div class="parciales-body">
        <!-- 1. Formulario Nuevo Parcial Base -->
        <form class="parcial-form" id="examForm">
          <div class="form-title" id="formTitle">Nuevo Parcial</div>
          <input type="hidden" id="editExamId">
          
          <div class="form-row">
            <input type="text" id="examNameInput" class="form-input" placeholder="Materia (ej: 1° Parcial Dev. Software)" required>
          </div>
          <div class="form-row">
            <input type="date" id="examDateInput" class="form-input" required>
            <input type="text" id="examRoomInput" class="form-input" placeholder="Aula (opcional)">
          </div>

          <div class="form-actions">
            <button type="button" class="btn-sub" id="btnCancelExam">Cancelar</button>
            <button type="submit" class="btn-mini" style="padding:6px 14px;">Guardar Parcial</button>
          </div>
        </form>

        <!-- 2. Modal Cargar / Cambiar Nota -->
        <form class="parcial-form" id="gradeForm" style="border-color:var(--cyan);">
          <div class="form-title" id="gradeFormTitle">📝 Cargar Calificación</div>
          <input type="hidden" id="gradeExamId">
          
          <div class="form-row">
            <select id="gradeStatusInput" class="form-input" onchange="onGradeStatusChange()">
              <option value="aprobado">🟢 Aprobado</option>
              <option value="recu">🟡 A Recuperatorio</option>
              <option value="desaprobado">🔴 Desaprobado Definitivo</option>
            </select>
            <input type="text" id="gradeInput" class="form-input" placeholder="Nota (ej: 8, 4, Apto)" required>
          </div>

          <!-- Campos extra automáticos si va a recuperatorio -->
          <div id="recuAutoGroup" style="display:none; flex-direction:column; gap:8px; border-top:1px dashed var(--border); padding-top:8px;">
            <div class="form-title" style="color:#ffbd2e; font-size:11px;">⚡ Programar Examen Recuperatorio:</div>
            <div class="form-row">
              <input type="date" id="autoRecuDateInput" class="form-input" title="Fecha del Recu">
              <input type="text" id="autoRecuRoomInput" class="form-input" placeholder="Aula del Recu (opcional)">
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-sub" id="btnCancelGrade">Cancelar</button>
            <button type="submit" class="btn-mini" style="background:var(--cyan); color:#04140a;">Confirmar</button>
          </div>
        </form>

        <!-- Lista Filtrada Dinámica -->
        <div class="exam-list" id="examList"></div>
      </div>
    </section>

    <footer class="tip">// tocá las pestañas de arriba para ver aprobados o desaprobados</footer>
  </div>

</body>
</html>
